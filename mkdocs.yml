site_name: ASHA
site_description: Mission-aware agent governance (ANCHOR) plus LLM security and optimization (v0.4.2 developer preview)
site_url: https://ajayrajan05.github.io/asha-si/
repo_url: https://github.com/AjayRajan05/asha-si
repo_name: AjayRajan05/asha-si

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true

nav:
  - Getting Started: index.md
  - Provider Coverage: integrations.md
  - Security & Threat Model: security.md
  - Competitor Comparisons: comparison.md
  - Architecture & Optimization: architecture.md
  - Agent Governance (ANCHOR): anchor.md
  - API Reference: api-reference.md
  - Troubleshooting & FAQ: troubleshooting.md
  - Production Readiness & Roadmap: production-readiness.md
  - Contributing & Support:
      - Contributing Guide: contributing.md
      - Support Policy: support.md
      - Code of Conduct: code-of-conduct.md
      - Security Policy: security-policy.md
      - Changelog: changelog.md

