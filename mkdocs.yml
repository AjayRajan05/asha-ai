site_name: ASHA
site_description: Mission-aware agent governance (ANCHOR) plus LLM security and optimization (v0.4.2 developer preview)
site_url: https://ajayrajan05.github.io/ASHA/
repo_url: https://github.com/AjayRajan05/ASHA
repo_name: AjayRajan05/ASHA

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Status: status.md
  - Tutorial: tutorial.md
  - How-to guides:
      - Integrations: integrations.md
      - Security: security.md
      - Optimization: optimization.md
      - Debugging: debugging.md
      - Troubleshooting: troubleshooting.md
      - Performance: performance.md
      - Migration v0.4: migration-v0.4.md
  - Reference:
      - API Reference: api-reference.md
      - Examples: examples.md
      - Versioning: versioning.md
      - Deprecations: deprecations.md
  - Explanation:
      - Core Concepts: core-concepts.md
      - Architecture: architecture.md
      - ANCHOR Runtime: anchor.md
      - Compliance: compliance.md
      - Roadmap: roadmap.md
      - Production readiness (0.4.2): production-readiness.md
      - Threat Model: security/threat-model.md
      - Developer Preview: release/developer-preview.md
      - Experimental features: experimental-features.md
  - Support:
      - Support policy: support.md
      - FAQ: faq.md
      - Contributing: contributing.md
