[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asha-ai"
version = "0.4.2"
description = "ASHA developer preview (0.4.2) — mission-aware agent governance (ANCHOR) plus drop-in LLM security/optimization. pip install asha-ai — import asha. No API key or model download required."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Ajay Rajan A", email = "ajayrajan727@gmail.com"}
]
maintainers = [
    {name = "Ajay Rajan A", email = "ajayrajan727@gmail.com"}
]
keywords = [
    "llm",
    "security",
    "optimization",
    "privacy",
    "pii-detection",
    "openai",
    "anthropic",
    "gemini",
    "prompt-engineering"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content"
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "tiktoken>=0.5.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "click>=8.0.0,<9.0.0",
    # Text-document extraction for PII masking of file inputs (no OCR).
    "pypdf>=4.0.0,<7.0.0",
    "python-docx>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "black>=22.0.0,<26.0.0",
    "flake8>=5.0.0,<8.0.0",
    "mypy>=1.0.0,<3.0.0",
    # Present on publish/CI runners so lite-path tests that touch ML helpers import cleanly.
    "numpy>=1.23.0,<3.0.0",
]
docs = [
    "mkdocs>=1.4.0,<3.0.0",
    "mkdocs-material>=8.5.0,<10.0.0",
    "mkdocstrings[python]>=0.19.0,<2.0.0"
]
openai = [
    "openai>=1.0.0,<3.0.0"
]
anthropic = [
    "anthropic>=0.5.0,<1.0.0"
]
gemini = [
    "google-generativeai>=0.3.0,<1.0.0"
]
transformers = [
    "transformers>=4.20.0,<6.0.0",
    "torch>=1.12.0,<3.0.0",
    "accelerate>=0.20.0,<2.0.0"
]
ml = [
    "asha-ai[transformers]",
    "spacy>=3.4.0,<4.0.0",
]
# Classical ML/DL detectors for ASHA hardening (no generative LLM calls).
# Lazy-imported at use time; lite installs without this extra stay light.
hardened = [
    "asha-ai[ml]",
    "sentence-transformers>=2.2.0,<4.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "numpy>=1.23.0,<3.0.0",
    "joblib>=1.2.0,<2.0.0",
    "lightgbm>=3.3.0,<5.0.0",
    "langdetect>=1.0.9,<2.0.0",
    "PyYAML>=6.0,<7.0",
    # Optional KenLM bindings; perplexity scorer falls back to a pure-Python
    # n-gram model when kenlm is unavailable.
    "kenlm>=0.2.0,<1.0.0; platform_system != 'Windows'",
]
# Optional Aho-Corasick accelerator for lite-tier pattern matching (stdlib fallback exists).
fast = [
    "pyahocorasick>=2.0.0",
]
fastapi = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
]
flask = [
    "flask>=2.0.0,<4.0.0",
]
django = [
    "django>=4.0.0,<6.0.0",
]
# Prompt + ANCHOR LangChain surface (openai provider stays optional).
langchain = [
    "langchain-core>=0.2.0,<1.0.0",
    "langchain>=0.2.0,<1.0.0",
]
langgraph = [
    "asha-ai[langchain]",
    "langgraph>=0.2.0,<1.0.0",
]
crewai = [
    "crewai>=0.80.0,<1.0.0",
]
llamaindex = [
    "llama-index-core>=0.10.0,<1.0.0",
]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]
# All ANCHOR framework adapters (optional; lite install stays free of these).
anchor = [
    "asha-ai[crewai,langchain,langgraph,llamaindex,mcp]",
]
instructor = [
    "instructor>=0.4.0,<2.0.0",
    "asha-ai[openai]",
]
integrations = [
    "asha-ai[fastapi,langchain,instructor]",
]
otel = [
    "opentelemetry-api>=1.20.0,<3.0.0",
    "opentelemetry-sdk>=1.20.0,<3.0.0",
]
local-advisor = [
    "huggingface_hub>=0.20.0,<2.0.0",
]
local-advisor-gpu = [
    "asha-ai[local-advisor]",
    "nvidia-ml-py>=12.0.0,<14.0.0",
]
demo = [
    "streamlit>=1.28.0,<2.0.0",
    "plotly>=5.18.0,<6.0.0",
    "streamlit-option-menu>=0.3.6,<0.5.0",
    "streamlit-extras>=0.4.0,<0.7.0",
]
all = [
    "asha-ai[openai,anthropic,gemini,ml,hardened,fastapi,flask,django,langchain,instructor,otel,llamaindex,local-advisor,anchor,demo]",
]

[project.urls]
Homepage = "https://github.com/AjayRajan05/ASHA"
Documentation = "https://ajayrajan05.github.io/ASHA/"
Issues = "https://github.com/AjayRajan05/ASHA/issues"
Changelog = "https://github.com/AjayRajan05/ASHA/blob/main/CHANGELOG.md"

[project.scripts]
asha = "asha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asha = ["py.typed"]
"asha.config" = ["thresholds.yaml"]
"asha.runtime.local_advisor.catalog" = ["fallback.json"]
"*" = ["*.md", "*.txt"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "asha.integrations.langchain.*",
    "asha.integrations.llamaindex.*",
    "asha.integrations.auto_patch",
    "asha.integrations.framework_adapters",
    "asha.integrations.composition_strategy",
    "asha.integrations.fastapi.*",
    "asha.integrations.flask.*",
    "asha.runtime.adapters.claude_adapter",
    "asha.runtime.adapters.hf_adapter",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config -m \"not integration\""
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require API keys)"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]