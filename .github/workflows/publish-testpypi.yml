name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip test suite (not recommended)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build "twine<7.0.0" pytest
          pip install -e ".[dev]"

      - name: Pre-flight public surface and contract tests
        if: inputs.skip_tests != 'true'
        run: |
          python scripts/check_public_surface.py
          python -m pytest tests/architecture tests/imports tests/public_api -q --tb=short
        env:
          ASHA_DISABLE_ML: "1"

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Fresh-install smoke test
        run: |
          python -m pip install dist/*.whl --force-reinstall
          python -c "from asha import process, sanitize, anchor, Agent; assert sanitize('a@b.com'); print(process('hello')); print(anchor(Agent(provider='mock', model='mock')))"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
