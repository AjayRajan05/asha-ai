name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Skip models-only tags; those must not upload a Python package.
    if: ${{ !startsWith(github.ref, 'refs/tags/asha-models-') }}
    environment: pypi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build "twine<7.0.0" pytest
          pip install -e ".[dev]"

      - name: Pre-flight public surface and contract tests
        run: |
          python scripts/check_public_surface.py
          python -m pytest tests/architecture tests/imports tests/public_api -q --tb=short
        env:
          ASHA_DISABLE_ML: "1"

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Fresh-install smoke test
        run: |
          python -m pip install dist/*.whl --force-reinstall
          python -c "from asha import process, sanitize, anchor, Agent; assert sanitize('a@b.com'); print(process('hello')); print(anchor(Agent(provider='mock', model='mock')))"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
